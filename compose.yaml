# Single host: PostgreSQL (pgvector), a one-off migration, the API and one worker.
# At the repository root so every relative path means the same thing whether compose runs
# here (`docker compose --env-file deploy/.env up -d`) or a hosting panel passes the
# repository as --project-directory. Values: tools/make_env.py or deploy/env.full.example.
# More workers or API replicas: `--scale worker=3` (jobs are claimed with SKIP LOCKED).
name: mindgrid

x-app: &app
  image: ${MINDGRID_IMAGE:-mindgrid:local}
  build: { context: ., dockerfile: deploy/Dockerfile }
  environment: &app-env
    MINDGRID_DATABASE_URL: postgresql+asyncpg://mindgrid_app:${DB_APP_PASSWORD:?}@db:5432/mindgrid
    # Every application variable is passed explicitly (panels hand containers only what the
    # compose file names); blank = the default. Variables the image sets are left out.
    # >>> application variables (generated by tools/config_reference.py)
    MINDGRID_CONNECTOR_MIN_EVERY_MINUTES: ${MINDGRID_CONNECTOR_MIN_EVERY_MINUTES:-}
    MINDGRID_BRAND_NAME: ${MINDGRID_BRAND_NAME:-}
    MINDGRID_BRAND_SHORT_NAME: ${MINDGRID_BRAND_SHORT_NAME:-}
    MINDGRID_BRAND_TAGLINE: ${MINDGRID_BRAND_TAGLINE:-}
    MINDGRID_BRAND_LOGO_URL: ${MINDGRID_BRAND_LOGO_URL:-}
    MINDGRID_BRAND_PRIMARY_COLOR: ${MINDGRID_BRAND_PRIMARY_COLOR:-}
    MINDGRID_BRAND_PRIMARY_COLOR_DARK: ${MINDGRID_BRAND_PRIMARY_COLOR_DARK:-}
    MINDGRID_OUTBOUND_ALLOW_PRIVATE_HOSTS: ${MINDGRID_OUTBOUND_ALLOW_PRIVATE_HOSTS:-}
    MINDGRID_LOG_LEVEL: ${MINDGRID_LOG_LEVEL:-}
    MINDGRID_DOCS: ${MINDGRID_DOCS:-}
    MINDGRID_DATASET_MAX_BYTES: ${MINDGRID_DATASET_MAX_BYTES:-}
    MINDGRID_DATASET_KEEP_VERSIONS: ${MINDGRID_DATASET_KEEP_VERSIONS:-}
    MINDGRID_DB_APP_ROLE: ${MINDGRID_DB_APP_ROLE:-}
    MINDGRID_DB_POOL_SIZE: ${MINDGRID_DB_POOL_SIZE:-}
    MINDGRID_DB_STATEMENT_TIMEOUT_MS: ${MINDGRID_DB_STATEMENT_TIMEOUT_MS:-}
    MINDGRID_MAX_BODY_BYTES: ${MINDGRID_MAX_BODY_BYTES:-}
    MINDGRID_RECALL_LOG_DAYS: ${MINDGRID_RECALL_LOG_DAYS:-}
    MINDGRID_EVAL_MAX_CASES: ${MINDGRID_EVAL_MAX_CASES:-}
    MINDGRID_EVAL_JUDGE_SECONDS: ${MINDGRID_EVAL_JUDGE_SECONDS:-}
    MINDGRID_INDEX_CONTEXT_SECONDS: ${MINDGRID_INDEX_CONTEXT_SECONDS:-}
    MINDGRID_INDEX_CONTEXT_MAX_CHARS: ${MINDGRID_INDEX_CONTEXT_MAX_CHARS:-}
    MINDGRID_INDEX_CONTEXT_OUTLINE_CHARS: ${MINDGRID_INDEX_CONTEXT_OUTLINE_CHARS:-}
    MINDGRID_INDEX_CONTEXT_NEIGHBOUR_CHARS: ${MINDGRID_INDEX_CONTEXT_NEIGHBOUR_CHARS:-}
    MINDGRID_MAX_UPLOAD_BYTES: ${MINDGRID_MAX_UPLOAD_BYTES:-}
    MINDGRID_CHUNK_CHARS: ${MINDGRID_CHUNK_CHARS:-}
    MINDGRID_CHUNK_OVERLAP_CHARS: ${MINDGRID_CHUNK_OVERLAP_CHARS:-}
    MINDGRID_PDF_MAX_PAGES: ${MINDGRID_PDF_MAX_PAGES:-}
    MINDGRID_CSV_ROWS_PER_CHUNK: ${MINDGRID_CSV_ROWS_PER_CHUNK:-}
    MINDGRID_RECALL_K: ${MINDGRID_RECALL_K:-}
    MINDGRID_RECALL_MAX_K: ${MINDGRID_RECALL_MAX_K:-}
    MINDGRID_RECALL_CANDIDATES: ${MINDGRID_RECALL_CANDIDATES:-}
    MINDGRID_RECALL_RRF_K: ${MINDGRID_RECALL_RRF_K:-}
    MINDGRID_RECALL_EF_SEARCH: ${MINDGRID_RECALL_EF_SEARCH:-}
    MINDGRID_RECALL_TRIGRAM_THRESHOLD: ${MINDGRID_RECALL_TRIGRAM_THRESHOLD:-}
    MINDGRID_RECALL_RERANK_CANDIDATES: ${MINDGRID_RECALL_RERANK_CANDIDATES:-}
    MINDGRID_RECALL_MIN_RELEVANCE: ${MINDGRID_RECALL_MIN_RELEVANCE:-}
    MINDGRID_RECALL_MAX_VECTOR_DISTANCE: ${MINDGRID_RECALL_MAX_VECTOR_DISTANCE:-}
    MINDGRID_RECALL_REWRITE_SECONDS: ${MINDGRID_RECALL_REWRITE_SECONDS:-}
    MINDGRID_RECALL_MAX_QUERY_CHARS: ${MINDGRID_RECALL_MAX_QUERY_CHARS:-}
    MINDGRID_ACCESS_TOKEN_TTL_S: ${MINDGRID_ACCESS_TOKEN_TTL_S:-}
    MINDGRID_REFRESH_TOKEN_TTL_DAYS: ${MINDGRID_REFRESH_TOKEN_TTL_DAYS:-}
    MINDGRID_SIGNATURE_SKEW_S: ${MINDGRID_SIGNATURE_SKEW_S:-}
    MINDGRID_KEY_MAX_DAYS: ${MINDGRID_KEY_MAX_DAYS:-}
    MINDGRID_PUBLIC_URL: ${MINDGRID_PUBLIC_URL:-}
