    MINDGRID_SESSION_IDLE_MINUTES: ${MINDGRID_SESSION_IDLE_MINUTES:-}
    MINDGRID_SESSION_TOUCH_EVERY_S: ${MINDGRID_SESSION_TOUCH_EVERY_S:-}
    MINDGRID_JOB_LEASE_SECONDS: ${MINDGRID_JOB_LEASE_SECONDS:-}
    MINDGRID_JOB_MAX_ATTEMPTS: ${MINDGRID_JOB_MAX_ATTEMPTS:-}
    MINDGRID_JOB_RETRY_BASE_SECONDS: ${MINDGRID_JOB_RETRY_BASE_SECONDS:-}
    MINDGRID_JOB_IDLE_SECONDS: ${MINDGRID_JOB_IDLE_SECONDS:-}
    MINDGRID_SECRET_KEY: ${MINDGRID_SECRET_KEY:-}
    MINDGRID_SIGNIN_LIMIT: ${MINDGRID_SIGNIN_LIMIT:-}
    MINDGRID_SIGNIN_IP_LIMIT: ${MINDGRID_SIGNIN_IP_LIMIT:-}
    MINDGRID_SIGNIN_WINDOW_S: ${MINDGRID_SIGNIN_WINDOW_S:-}
    MINDGRID_EMBEDDING_PROVIDER: ${MINDGRID_EMBEDDING_PROVIDER:-}
    MINDGRID_EMBED_LOCAL_MODEL: ${MINDGRID_EMBED_LOCAL_MODEL:-}
    MINDGRID_EMBED_LOCAL_DIMS: ${MINDGRID_EMBED_LOCAL_DIMS:-}
    MINDGRID_EMBED_THREADS: ${MINDGRID_EMBED_THREADS:-}
    MINDGRID_EMBED_QUERY_TEMPLATE: ${MINDGRID_EMBED_QUERY_TEMPLATE:-}
    MINDGRID_EMBED_DOCUMENT_TEMPLATE: ${MINDGRID_EMBED_DOCUMENT_TEMPLATE:-}
    MINDGRID_EMBED_GEMINI_MODEL: ${MINDGRID_EMBED_GEMINI_MODEL:-}
    MINDGRID_EMBED_GEMINI_DIMS: ${MINDGRID_EMBED_GEMINI_DIMS:-}
    MINDGRID_EMBED_BATCH: ${MINDGRID_EMBED_BATCH:-}
    MINDGRID_LLM_GEMINI_MODEL: ${MINDGRID_LLM_GEMINI_MODEL:-}
    MINDGRID_LLM_LOCAL_URL: ${MINDGRID_LLM_LOCAL_URL:-}
    MINDGRID_LLM_LOCAL_MODEL: ${MINDGRID_LLM_LOCAL_MODEL:-}
    MINDGRID_LLM_LOCAL_CONTEXT_TOKENS: ${MINDGRID_LLM_LOCAL_CONTEXT_TOKENS:-}
    MINDGRID_LLM_TIMEOUT_SECONDS: ${MINDGRID_LLM_TIMEOUT_SECONDS:-}
    MINDGRID_LLM_TEMPERATURE: ${MINDGRID_LLM_TEMPERATURE:-}
    MINDGRID_LLM_MAX_OUTPUT_TOKENS: ${MINDGRID_LLM_MAX_OUTPUT_TOKENS:-}
    MINDGRID_RERANK_PROVIDER: ${MINDGRID_RERANK_PROVIDER:-}
    MINDGRID_RERANK_LOCAL_MODEL: ${MINDGRID_RERANK_LOCAL_MODEL:-}
    MINDGRID_RERANK_THREADS: ${MINDGRID_RERANK_THREADS:-}
    MINDGRID_RERANK_MAX_CHARS: ${MINDGRID_RERANK_MAX_CHARS:-}
    MINDGRID_SYNAPSE_ALLOWED_ROOTS: ${MINDGRID_SYNAPSE_ALLOWED_ROOTS:-}
    MINDGRID_SYNAPSE_MAX_FILE_BYTES: ${MINDGRID_SYNAPSE_MAX_FILE_BYTES:-}
    MINDGRID_SYNAPSE_MAX_ITEMS: ${MINDGRID_SYNAPSE_MAX_ITEMS:-}
    MINDGRID_SYNAPSE_GIT_TIMEOUT: ${MINDGRID_SYNAPSE_GIT_TIMEOUT:-}
    # <<< application variables
  volumes: [models:/data/models]
  restart: unless-stopped
  depends_on:
    migrate: { condition: service_completed_successfully }

services:
  db:
    image: pgvector/pgvector:0.8.7-pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
    environment:
      POSTGRES_USER: mindgrid
      POSTGRES_DB: mindgrid
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindgrid -d mindgrid"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    # The app role is made here (as the owner), not by an init script: works where repository
    # files are not kept next to the database, and applies a changed password on redeploy.
    command: ["sh", "-c", "mindgrid admin ensure-app-role && alembic upgrade head"]
    environment:
      <<: *app-env
      MINDGRID_MIGRATION_DATABASE_URL: postgresql+asyncpg://mindgrid:${DB_OWNER_PASSWORD:?}@db:5432/mindgrid
    restart: "no"
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: *app
    # Port 8700 inside the network only: a hosting panel's proxy reaches it there. To publish
    # it on this host (own TLS proxy), add -f deploy/compose.local.yaml.
    expose: ["8700"]

  worker:
    <<: *app
    command: ["mindgrid", "worker", "run"]
    healthcheck: { disable: true }
    # Heavy runs and indexing must not slow the pages: when both want the CPU, the API gets
    # four times the worker's share (no cap: an idle host lets the worker use all of it),
    # and under memory pressure the kernel stops the worker before the API or the database.
    cpu_shares: 256
    oom_score_adj: 500

volumes:
  pgdata:
  models:
